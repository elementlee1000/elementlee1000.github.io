<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title data-en="Element Lee | Artworks" data-zh="李元素 | 作品">Element Lee | Artworks</title>
    <link rel="icon" type="image/png" href="images/main/logo.png">
    <script src="i18n.js"></script>
    <style>
        /* ── Base ───────────────────────────────────── */
        :root { color-scheme: only light; }

        /* 语言切换：只显示当前语言的元素（i18n.js 负责设置 html[data-lang]） */
        html[data-lang="en"] [lang="zh"] { display: none !important; }
        html[data-lang="zh"] [lang="en"] { display: none !important; }
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
            transition: none !important; animation: none !important;
        }
        html { scroll-behavior: auto !important; background-color: #e7e4e4; color: #333; }
        body { line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        a:hover { color: #000; }

        /* ── Nav ─────────────────────────────────────── */
        nav { display: flex; justify-content: center; align-items: center; padding: 2rem 5%; width: 100%; z-index: 1000; position: relative; }
        .nav-links { list-style: none; display: flex; gap: 2rem; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }
        .nav-links a.active { font-weight: bold; }

        /* ── Artworks Main ───────────────────────────── */
        #artworks-main { max-width: 1200px; margin: 0 auto; padding: 2rem 5%; }

        h2.section-title { font-size: 2rem; font-weight: 300; margin-bottom: 3rem; text-align: left; }
        p.description { font-size: 0.9rem; color: #666; margin-bottom: 2rem; max-width: 800px; }

        #artworks-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 3rem;
            row-gap: 2rem;
            margin-top: 3rem;
            align-items: start;
        }

        .artwork-card { display: block; text-decoration: none; color: inherit; max-width: 180px; }
        .artwork-card:nth-child(even) { margin-top: 3.5rem; }
        .artwork-card:hover .artwork-thumb { opacity: 0.85; }

        .artwork-thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; display: block; background: #e8e8e8; }

        .artwork-info { margin-top: 0.5rem; }
        .artwork-info h3 { font-size: 0.85rem; font-weight: 500; margin: 0; line-height: 1.4; }
        .info-colon { display: block; font-size: 0.85rem; color: #555; line-height: 1.2; margin-top: 0.1rem; }
        .artwork-info p { font-size: 0.75rem; color: #888; margin-top: 0.2rem; line-height: 1.4; }

        /* ── Footer ─────────────────────────────────── */
        footer { text-align: center; padding: 2rem; margin-top: 4rem; }
        .footer-logo { font-size: 0.8rem; color: #777; }

        /* ── Mobile ─────────────────────────────────── */
        @media (max-width: 600px) {
            nav { padding: 1.2rem 5%; }
            .nav-links { gap: 1rem; font-size: 0.75rem; }
            h2.section-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
            #artworks-list { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .artwork-info h3 { font-size: 0.85rem; }
        }
        @media (min-width: 601px) and (max-width: 900px) {
            #artworks-list { grid-template-columns: repeat(2, 1fr); gap: 2rem; }
        }
    </style>
</head>
<body>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html"><span lang="en">HOME</span><span lang="zh">首页</span></a></li>
            <li><a href="artworks.html" class="active"><span lang="en">ARTWORKS</span><span lang="zh">作品</span></a></li>
            <li><a href="exhibitions.html"><span lang="en">EXHIBITIONS</span><span lang="zh">展览</span></a></li>
            <li><a href="articles.html"><span lang="en">ARTICLES</span><span lang="zh">文章</span></a></li>
            <li><a href="#" id="lang-toggle"><span lang="en">中文</span><span lang="zh">EN</span></a></li>
        </ul>
    </nav>

    <main id="artworks-main">
        <h2 class="section-title"><span lang="en">Artworks</span><span lang="zh">作品</span></h2>

        <div id="artworks-list"></div>
    </main>

    <footer>
        <p class="footer-logo">李元素 / Element Lee</p>
    </footer>

    <script>
    fetch('images/Artworks/manifest.json')
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('artworks-list');

            // 缩略图只随机选一次，避免切换语言时图片跳动
            const thumbs = data.artworks.map(a => a.images.length
                ? a.images[Math.floor(Math.random() * a.images.length)]
                : '');

            function esc(s) {
                return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            }

            function render() {
                list.textContent = '';

                data.artworks.forEach((artwork, i) => {
                    if (!artwork.images.length) return;

                    const imgSrc = 'images/Artworks/' + encodeURIComponent(artwork.folder) + '/' + encodeURIComponent(thumbs[i]);
                    const title = I18N.pick(artwork, 'title') || artwork.folder;
                    const desc = I18N.pick(artwork, 'description');

                    const a = document.createElement('a');
                    a.href = 'project-detail.html?p=' + encodeURIComponent(artwork.folder);
                    a.className = 'artwork-card';

                    a.innerHTML =
                        '<img class="artwork-thumb" src="' + imgSrc + '" alt="' + esc(title) + '">' +
                        '<div class="artwork-info">' +
                            '<h3>' + esc(title) + '</h3>' +
                            '<span class="info-colon">:</span>' +
                            (desc ? '<p>' + esc(desc) + '</p>' : '') +
                        '</div>';

                    list.appendChild(a);
                });
            }

            I18N.onChange(render);
            render();
        });
    </script>
</body>
</html>
